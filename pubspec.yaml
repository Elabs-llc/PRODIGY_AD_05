name: qr_code_pro
description: "Production-ready QR Code Scanner & Generator with enterprise features."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # QR Code functionality
  barcode_widget: ^2.0.4
  mobile_scanner: ^5.2.3  # Modern, well-maintained QR scanner
  qr_flutter: ^4.1.0  # Advanced QR generation with customization

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Security
  encrypt: ^5.0.3
  crypto: ^3.0.5

  # Networking & Validation
  url_launcher: ^6.3.0
  validators: ^3.0.0
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  logger: ^2.4.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  image: ^4.2.0
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Analytics & Monitoring
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Animations
  animations: ^2.0.11

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

  # Build Tools
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true  # Enable Flutter gen-l10n for i18n

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
